name: CI

on:
  push:
    branches: [main, "fm/**", "bb/**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check corpdk_fx

  migrate:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Migrate against bench (skeleton)
        run: |
          echo "P0 CI skeleton: wire bench get-app + bench migrate on a v16 site in follow-up."
          echo "DocTypes ship as JSON; local validation is ruff above."
