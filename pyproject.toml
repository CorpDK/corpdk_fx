[project]
name = "corpdk_fx"
authors = [{ name = "CorpDK", email = "ops@corpdk.local" }]
description = "Configurable FX pairs, rate dashboard, and Sales Invoice conversion on submit"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
license = { text = "MIT" }

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.bench.dev-dependencies]
corpdk_fx = []

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["W191"]

[tool.ruff.format]
indent-style = "tab"
